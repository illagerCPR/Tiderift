name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-regression:
    name: Build + server regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-fund --no-audit

      - name: Install server dependencies
        run: npm ci --no-fund --no-audit
        working-directory: server

      - name: Syntax check all JS sources (node --check)
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find src server tests -type f \( -name '*.js' -o -name '*.mjs' \) -not -path '*/node_modules/*' -print0)
          echo "node --check passed: $count files"

      - name: Build frontend
        run: npm run build

      - name: Run full regression suites (tests/ + server/)
        run: ./server/run-all-tests.sh
