name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-regression:
    name: Build + server regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-fund --no-audit

      - name: Install server dependencies
        run: npm ci --no-fund --no-audit
        working-directory: server

      - name: Build frontend
        run: npm run build

      - name: Run full regression suites (tests/ + server/)
        run: ./server/run-all-tests.sh
