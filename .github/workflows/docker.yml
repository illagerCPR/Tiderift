name: Docker Image

# 构建 Tiderift 一体化镜像（客户端静态站 + 联机服务器）并推送到 GHCR。
# 触发：
#   - push master        → 推 :master / :sha-<短哈希>（供测试）
#   - push beta-build-*  → 推 :beta-build-<X> / :latest
#   - Release published  → 推 :beta-build-<X> / :latest（正式版）
#   - pull_request       → 只构建不推送（验证 Dockerfile 可构建）
#   - workflow_dispatch  → 手动补发
on:
  push:
    branches: [master]
    tags: ['beta-build-*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ github.repository_owner }}/tiderift-server

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # PR 来自 fork 时 GITHUB_TOKEN 无 packages:write，跳过登录与推送
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/beta-build-') || github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 冒烟：单平台构建后起容器，验证前端/管理面板/API/WS 四条链路
  smoke:
    name: Smoke test image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image locally (amd64 only)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tiderift:smoke
          cache-from: type=gha

      - name: Start container
        run: |
          set -euo pipefail
          docker run -d --name tiderift-smoke \
            -p 3001:3001 \
            -v tiderift-smoke-data:/data \
            tiderift:smoke
          # 等健康检查通过（最多 60 秒）
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/admin; then
              echo "container ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Smoke test HTTP endpoints
        run: |
          set -euo pipefail
          echo '--- GET / (客户端静态站) ---'
          curl -fsS http://127.0.0.1:3001/ | grep -q '<title>Tiderift</title>'
          echo 'OK: / 返回客户端页面'

          echo '--- GET /admin (管理面板) ---'
          curl -fsS http://127.0.0.1:3001/admin | grep -q '服务器管理面板'
          echo 'OK: /admin 返回管理面板'

          echo '--- GET /api/status ---'
          curl -fsS http://127.0.0.1:3001/api/status | grep -q '"bootTime"'
          echo 'OK: /api/status 返回 JSON'

          echo '--- 目录穿越拦截 ---'
          code=$(curl -s -o /dev/null -w '%{http_code}' --path-as-is 'http://127.0.0.1:3001/../package.json')
          test "$code" = "404"
          echo 'OK: 目录穿越返回 404'

      - name: Smoke test WebSocket handshake
        run: |
          set -euo pipefail
          # 用容器内自带的 ws 依赖做握手（runner 上没有 ws）
          docker exec tiderift-smoke node -e "
          const WebSocket = require('/app/server/node_modules/ws');
          const ws = new WebSocket('ws://127.0.0.1:3001/ws');
          const timer = setTimeout(() => { console.error('WS 握手超时'); process.exit(1); }, 10000);
          ws.on('open', () => ws.send(JSON.stringify({ t: 'hello', name: 'smoke', version: 2 })));
          ws.on('message', (d) => {
            const m = JSON.parse(d.toString());
            if (m.t === 'welcome') {
              console.log('OK: WS 握手成功 protocol=' + m.protocol);
              clearTimeout(timer); ws.close(); process.exit(0);
            }
            if (m.t === 'kicked') { console.error('WS 被拒: ' + m.reason); process.exit(1); }
          });
          ws.on('error', (e) => { console.error('WS 错误: ' + e.message); process.exit(1); });
          "

      - name: Verify data persistence
        run: |
          set -euo pipefail
          docker exec tiderift-smoke sh -c 'ls -la /data'
          docker restart tiderift-smoke
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/admin; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3001/admin
          echo 'OK: 重启后服务仍可用（数据卷挂载正常）'

      - name: Container logs
        if: always()
        run: docker logs tiderift-smoke

      - name: Cleanup
        if: always()
        run: |
          docker rm -f tiderift-smoke || true
          docker volume rm tiderift-smoke-data || true
